<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F2E4D" />
    <meta name="color-scheme" content="light" />

    <title>The Proportional House</title>
    <meta name="description" content="Mapping the U.S. House under proportional representation." />

    <!-- Canonical URL. Route components (useDocumentTitle) overwrite this href
       on navigation, but having it in the initial HTML means crawlers fetching
       a raw response always see the right canonical even before JS runs. -->
    <link rel="canonical" href="https://proportionalhouse.org/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Search Console / Bing verification. To verify via the HTML-tag method,
         paste your token below and uncomment. (Or verify via a Cloudflare DNS
         TXT record, which needs no code.) -->
    <!-- <meta name="google-site-verification" content="REPLACE_WITH_GSC_TOKEN" /> -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Proportional House" />
    <meta property="og:url" content="https://proportionalhouse.org/" />
    <meta property="og:title" content="The Proportional House" />
    <meta property="og:description" content="Mapping the U.S. House under proportional representation." />
    <meta property="og:image" content="https://proportionalhouse.org/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Proportional House" />
    <meta name="twitter:description" content="Mapping the U.S. House under proportional representation." />
    <meta name="twitter:image" content="https://proportionalhouse.org/og-card.png" />

    <!-- Structured data. WebSite + Organization run site-wide; specific pages
       (e.g. Home injects Dataset, /about injects FAQPage, /rankings injects
       ItemList) layer additional schemas on top via inline <script> tags. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "The Proportional House",
      "url": "https://proportionalhouse.org/",
      "description": "Mapping the U.S. House under proportional representation."
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "The Proportional House",
      "url": "https://proportionalhouse.org/",
      "logo": "https://proportionalhouse.org/logomark.svg",
      "sameAs": ["https://github.com/axelhufford/the-proportional-house"]
    }
    </script>

    <!-- Cloudflare Web Analytics — cookie-free, GDPR-safe, free with CF Pages.
       Two ways to enable:
         A) Dashboard auto-inject: Cloudflare → the-proportional-house →
            Settings → Web Analytics → Enable. CF injects the beacon on the
            edge; no code change needed. Leave the script tag below commented.
         B) Manual: copy the <script> from Web Analytics → "Add a site",
            paste the token below, and uncomment the tag.
    -->
    <!--
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "REPLACE_WITH_WEB_ANALYTICS_TOKEN"}'></script>
    -->

    <!-- Fonts are self-hosted: imported in src/main.tsx via @fontsource-variable
         (Inter + Source Serif 4), bundled and served same-origin by Vite. No
         render-blocking third-party request. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
